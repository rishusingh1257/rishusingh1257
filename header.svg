<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Data Science profile banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="scan" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="260" rx="14"/></clipPath>
  </defs>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .dim  { fill: #8a8a8a; }
    .name { fill: #ffffff; font-size: 46px; font-weight: 700; letter-spacing: 2px; }
    .role { fill: #e6e6e6; font-size: 20px; opacity: 0; animation: cycle 9s infinite both; }
    .r2 { animation-delay: 3s; }
    .r3 { animation-delay: 6s; }
    @keyframes cycle {
      0%        { opacity: 0; transform: translateY(6px); }
      6%, 30%   { opacity: 1; transform: translateY(0); }
      36%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    .train, .val { fill: none; stroke-linecap: round; stroke-dasharray: 520; animation: draw 6s ease-in-out infinite; }
    .train { stroke: #ffffff; stroke-width: 2.5; }
    .val   { stroke: #8a8a8a; stroke-width: 2; animation-delay: 0.3s; }
    @keyframes draw {
      0%   { stroke-dashoffset: 520; opacity: 1; }
      55%  { stroke-dashoffset: 0;   opacity: 1; }
      92%  { stroke-dashoffset: 0;   opacity: 1; }
      100% { stroke-dashoffset: 0;   opacity: 0; }
    }
    .dot { fill: #ffffff; opacity: 0; animation: pulse 6s ease-in-out infinite; }
    @keyframes pulse {
      0%, 52% { opacity: 0; }
      60%     { opacity: 1; }
      75%     { opacity: 0.3; }
      88%     { opacity: 1; }
      100%    { opacity: 0; }
    }
    .cur { fill: #ffffff; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%, 49% { fill: #ffffff; } 50%, 100% { fill: #000000; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="#000000"/>
    <rect width="1000" height="260" fill="url(#grid)"/>
    <rect x="-200" y="0" width="200" height="260" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1200 0" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="999" height="259" rx="14" fill="none" stroke="#2a2a2a"/>

  <!-- Left: identity -->
  <text x="48" y="62" class="dim" font-size="14">$ whoami</text>
  <text x="48" y="118" class="name">RISHU SINGH</text>

  <text x="48" y="160" class="role">Data Scientist · Machine Learning</text>
  <text x="48" y="160" class="role r2">Python · SQL · Statistics</text>
  <text x="48" y="160" class="role r3">Turning data into decisions</text>

  <text x="48" y="215" class="dim" font-size="14">$ python train.py <tspan class="cur">█</tspan></text>

  <!-- Right: animated training curve -->
  <line x1="600" y1="55" x2="600" y2="215" stroke="#333333"/>
  <line x1="600" y1="215" x2="950" y2="215" stroke="#333333"/>
  <text x="610" y="54" class="dim" font-size="11">loss</text>
  <text x="888" y="234" class="dim" font-size="11">epochs →</text>
  <text x="780" y="54" font-size="11"><tspan fill="#ffffff">━ train</tspan><tspan fill="#8a8a8a">   ━ val</tspan></text>

  <path class="val" d="M600 85 C620 85 635 135 665 156 C695 176 710 172 740 184 C770 196 800 192 830 196 C870 204 910 200 950 205"/>
  <path class="train" d="M600 75 C620 75 630 130 660 150 C690 170 700 160 730 175 C760 188 780 180 810 190 C850 200 900 195 950 198"/>
  <circle class="dot" cx="950" cy="198" r="4"/>
</svg>
